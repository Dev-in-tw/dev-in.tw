# Local development and integration tests only. Not used in production (Dokploy runs its own database service).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dit
      POSTGRES_PASSWORD: dit
      POSTGRES_DB: dit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dit -d dit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
