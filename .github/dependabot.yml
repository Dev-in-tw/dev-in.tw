version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm refuses versions younger than 3 days (minimumReleaseAge in pnpm-workspace.yaml)
    cooldown:
      default-days: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node runtime is pinned to 24; keep @types/node on the same major
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    ignore:
      # Node runtime is pinned to 24 (LTS)
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(docker)"
