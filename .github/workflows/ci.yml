name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shared gate (WP0). biome ci → typecheck → test → build, in that order.
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

  # Known vulnerabilities in production dependencies (high and critical). Reads only the
  # lockfile, so it runs in parallel with the checks job. Actions are pinned by commit SHA.
  audit:
    name: Dependency audit (prod, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high

  # Owned by WP-A: api tests against PostgreSQL 18 (production version) and the api image.
  api:
    name: api (postgres 18, image)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dit
          POSTGRES_PASSWORD: dit
          POSTGRES_DB: dit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dit -d dit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: api tests with coverage (PostgreSQL 18)
        run: pnpm --filter @dit/api test:coverage
        env:
          TEST_DATABASE_URL: postgres://dit:dit@127.0.0.1:5432/dit
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # Owned by WP-B: add web-only steps (e.g. Playwright against the mock server) here.
  web:
    name: web e2e and image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dit/web exec playwright install --with-deps chromium
      - run: pnpm --filter @dit/web build
      # Playwright against the mock gateway (standalone build + mock API), including @p1 specs and axe
      - run: pnpm --filter @dit/web e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
